[project]
name = "nexus-backed-mcp"
version = "0.1.0"
description = "Expose Nexus operations as MCP tools, and front upstream MCP servers with Nexus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1,<3",
    "nexus-rpc>=1.1.0",
    "pydantic>=2.0",
    "temporalio>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_backed_mcp", "src/nexus_proxy_mcp"]
