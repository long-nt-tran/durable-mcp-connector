[project]
name = "nexus-proxy-mcp"
version = "0.1.0"
description = "Front upstream MCP servers with Temporal Nexus services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.9",
    "httpx2>=2.0",
    "mcp>=2.1.1,<3",
    "nexus-rpc>=1.4.0",
    "pydantic>=2.0",
    "temporalio>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_proxy_mcp"]
