[project]
name = "durable-mcp-adapter"
version = "0.1.0"
description = "Connect OpenAI Agents SDK agents to Nexus-backed MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1,<3",
    "openai-agents>=0.22.0",
    "temporalio>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
